name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main-branch run may be publishing the rolling release. Let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  # This SDK image also supplies wasm's ordinary runtime libraries and tools.
  # Preserve the published image name and its OBELISK_LLVM_WASM_* interface.
  WASM_IMAGE: ghcr.io/kuree/obelisk-llvm-wasm32:latest@sha256:7e679d82f15d0455379891c22ee43da20224951a3d36db3204d0b4d6ad493d9c

jobs:
  version:
    name: Choose development build timestamp
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      # created_at belongs to the original run and is unchanged by a rerun.
      - id: timestamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timestamp=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '.created_at | fromdateiso8601')
          echo "value=$timestamp" >> "$GITHUB_OUTPUT"

  # Only project-owned TableGen outputs are needed to start the wasm build.
  generate-wasm-inputs:
    name: Generate wasm inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install generator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Generate wasm inputs
        run: |
          cmake -S . -B build-generated -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTALOS_INCLUDE_TESTS=OFF \
            -DTALOS_ENABLE_Z3=OFF
          cmake --build build-generated --target talos-generated-files

      - uses: actions/upload-artifact@v4
        with:
          name: talos-generated-files
          path: build-generated/generated
          if-no-files-found: error
          retention-days: 1

  # Every host is required; a new host stays advisory until green.
  build-and-test:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Disjoint cache prefixes retain existing caches without mixing hosts.
        include:
          - name: Build and test (x86_64-unknown-linux-gnu)
            # Keep the wheel's glibc baseline independent of ubuntu-latest.
            os: ubuntu-24.04
            advisory: false
            ccache: native-Linux
            wheel_arch: x86_64
            wheel_platform: manylinux_2_39_x86_64
            python_arch: x64
          - name: Build and test (aarch64-unknown-linux-gnu)
            os: ubuntu-24.04-arm
            advisory: false
            ccache: native-ARM64-Linux
            wheel_arch: aarch64
            wheel_platform: manylinux_2_39_aarch64
            python_arch: arm64
          - name: Build and test (x86_64-pc-windows-msvc)
            os: windows-latest
            advisory: false
            ccache: native-Windows
            wheel_platform: win_amd64
            python_arch: x64
          - name: Build and test (aarch64-pc-windows-msvc)
            os: windows-11-arm
            advisory: false
            ccache: native-ARM64-Windows
            wheel_platform: win_arm64
            python_arch: arm64
          # The arm64 runner has 3 cores and 7 GB of memory.
          - name: Build and test (aarch64-apple-darwin)
            os: macos-15
            advisory: false
            ccache: native-ARM64-macOS
            parallel: 2
            lit_jobs: 3
            wheel_platform: macosx_15_0_arm64
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel || 4 }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      # Byte-offset tests require LF, including on Windows.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must equal v' + version + ' from VERSION')
          PY

      - name: Set development version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python utils/packaging/dev_version.py "${{ needs.version.outputs.timestamp }}"

      - name: Install build and test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The LLVM SDK omits split-file; use the newest packaged test tools.
          llvm_tools=$(apt-cache --names-only search '^llvm-[0-9]+-tools$' \
                       | cut -d' ' -f1 | sort -V | tail -1)
          test -n "$llvm_tools"
          sudo apt-get install -y --no-install-recommends ninja-build cmake ccache \
            python3-pip python3-venv "$llvm_tools"
          # Permit a user install with the runner's externally managed Python.
          python3 -m pip install --user --break-system-packages lit
          # An unversioned name avoids lit.cfg.py's fixed version fallback list.
          mkdir -p "$HOME/.local/bin"
          ln -sf "/usr/lib/${llvm_tools%-tools}/bin/split-file" \
                 "$HOME/.local/bin/split-file"
          "$HOME/.local/bin/split-file" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Windows image provides CMake/Python/MSVC; the SDK provides split-file.
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install --no-progress -y ninja ccache
          python -m pip install lit packaging
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" \
            >> "$GITHUB_PATH"

      - name: Install build and test tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache zstd
          python3 -m venv "$RUNNER_TEMP/talos-venv"
          "$RUNNER_TEMP/talos-venv/bin/python" -m pip install lit delocate
          # The runner's existing LLVM supplies split-file, omitted by our SDK.
          ln -s "$(brew --prefix llvm@18)/bin/split-file" \
            "$RUNNER_TEMP/talos-venv/bin/split-file"
          "$RUNNER_TEMP/talos-venv/bin/split-file" --version
          echo "$RUNNER_TEMP/talos-venv/bin" >> "$GITHUB_PATH"

      # Keep the same Python for the native configure and wheel packaging.
      - name: Install wheel build tools
        run: |
          python -m pip install build 'scikit-build-core>=0.11' packaging
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install --break-system-packages 'auditwheel>=6.4' patchelf
          elif [ "$RUNNER_OS" = macOS ]; then
            python -m pip install 'delocate>=0.13'
          fi

      # Reserve cache space for compiled objects. Per-commit keys allow updates
      # to immutable entries; the prefix restores the latest compatible cache.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.ccache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.ccache }}-

      # The macOS LLVM SDK contains bitcode, so ccache cannot reuse its links.
      - name: Restore host ThinLTO cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: build/lto.cache
          key: host-lto-${{ matrix.ccache }}-${{ github.sha }}
          restore-keys: host-lto-${{ matrix.ccache }}-

      - name: Prepare compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=sloppiness=pch_defines,time_macros
          # SDK extraction may change the timestamps of the compiler that
          # builds the Windows and macOS target runtimes.
          if [ "$RUNNER_OS" != Linux ]; then
            ccache --set-config=compiler_check=content
          fi
          ccache --zero-stats

      # Exercise unmodified UVM as well as the self-contained regressions.
      - name: Configure
        run: |
          host_args=()
          if [ "$RUNNER_OS" = macOS ]; then
            # Find only the zstd keg: Homebrew's shared include directory also
            # holds packages such as fmt that would shadow the bundled ones.
            host_args=(
              "-Dzstd_ROOT=$(brew --prefix zstd)"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DLLVM_PARALLEL_LINK_JOBS=1
              -DTALOS_HOST_LTO_CACHE_POLICY=cache_size_bytes=2147483648:prune_interval=0s)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" \
            "${host_args[@]}" \
            -DTALOS_ENABLE_PCH=ON \
            "-DLLVM_LIT_ARGS=-sv;-j${{ matrix.lit_jobs || 4 }};--time-tests;--output=lit-results.json;--time-trace-output=lit-trace.json" \
            -DTALOS_INCLUDE_TESTS=ON \
            -DTALOS_CONFORMANCE_JOBS=4 \
            -DTALOS_ENABLE_REAL_UVM_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        # Compile excluded test helpers here so the test step only runs tests.
        run: cmake --build build --target all talos-test-depends

      - name: Run lit regression suite
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            nproc
            free -h
            /usr/bin/time -v cmake --build build --target check-talos
          elif [ "$RUNNER_OS" = macOS ]; then
            sysctl hw.logicalcpu hw.memsize
            /usr/bin/time -l cmake --build build --target check-talos
          else
            cmake --build build --target check-talos
          fi

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-${{ matrix.ccache }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/test/lit-results.json
            build/test/lit-trace.json
            build/.ninja_log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and check wheel
        run: |
          # Reuse the tested native build and install only the Talos component.
          python -m build --wheel --no-isolation --outdir dist \
            -Cbuild-dir=build -Ccmake.define.TALOS_INCLUDE_TESTS=ON
          if [ "$RUNNER_OS" = Linux ]; then
            python -m auditwheel show dist/*.whl
            python -m auditwheel repair --only-plat \
              --plat "${{ matrix.wheel_platform }}" --wheel-dir wheelhouse dist/*.whl
          elif [ "$RUNNER_OS" = macOS ]; then
            MACOSX_DEPLOYMENT_TARGET=15.0 delocate-wheel --require-archs arm64 \
              --wheel-dir wheelhouse dist/*.whl
          else
            mkdir -p wheelhouse
            cp dist/*.whl wheelhouse/
          fi
          python -m utils.packaging.check_wheels --wheel-dir wheelhouse \
            --require-platform "${{ matrix.wheel_platform }}"

      - name: Build and test full native archive
        run: python utils/packaging/build_archive.py --build build --output-dir native-archives

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: talos-archive-${{ matrix.ccache }}
          path: native-archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/talos-wheel-smoke"
          if [ "$RUNNER_OS" = Windows ]; then
            smoke_bin="$RUNNER_TEMP/talos-wheel-smoke/Scripts"
            smoke_python="$smoke_bin/python.exe"
          else
            smoke_bin="$RUNNER_TEMP/talos-wheel-smoke/bin"
            smoke_python="$smoke_bin/python"
          fi
          "$smoke_python" -m pip install \
            --pre --no-index --find-links wheelhouse talos-sv
          PATH="$smoke_bin:$PATH" "$smoke_python" utils/packaging/check_install.py

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: talos-wheel-${{ matrix.wheel_platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Run conformance and build generated reference site
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv "$RUNNER_TEMP/talos-docs"
          "$RUNNER_TEMP/talos-docs/bin/python" -m pip install -r docs/requirements.txt
          cmake --build build --target talos-docs --parallel 4
          "$RUNNER_TEMP/talos-docs/bin/python" -m sphinx \
            -b dirhtml -W --keep-going -c docs docs/reference docs/_site
          python3 utils/docs/check.py docs/_site

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main'
        with:
          name: talos-docs-site
          path: docs/_site
          if-no-files-found: error
          retention-days: 1

      - name: Compiler cache stats
        if: always()
        run: |
          ccache --show-stats --verbose
          df -h .
          if [ "$RUNNER_OS" = macOS ] && [ -d build/lto.cache ]; then
            du -sh build/lto.cache
          fi

      # PRs restore main's cache; branch-only saves would just compete for space.
      - name: Save compiler cache
        if: always() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.ccache }}-${{ github.sha }}

      - name: Save host ThinLTO cache
        if: always() && runner.os == 'macOS' && github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/lto.cache
          key: host-lto-${{ matrix.ccache }}-${{ github.sha }}

  publish-dev-wheels:
    name: Publish rolling development binaries
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Serialize publication without interrupting an upload and cleanup midway.
    concurrency:
      group: publish-dev-wheels
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: talos-wheel-*
          path: wheelhouse
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: talos-archive-*
          path: native-archives
          merge-multiple: true

      - name: Publish and prune dev assets
        run: |
          python3 -m venv "$RUNNER_TEMP/talos-release"
          "$RUNNER_TEMP/talos-release/bin/python" -m pip install packaging
          "$RUNNER_TEMP/talos-release/bin/python" utils/packaging/publish_dev.py \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --wheel-dir wheelhouse --archive-dir native-archives \
            --require-platform manylinux_2_39_x86_64 \
            --require-platform manylinux_2_39_aarch64 \
            --require-platform win_amd64 \
            --require-platform win_arm64 \
            --require-platform macosx_15_0_arm64 \
            --require-target x86_64-unknown-linux-gnu \
            --require-target aarch64-unknown-linux-gnu \
            --require-target x86_64-pc-windows-msvc \
            --require-target aarch64-pc-windows-msvc \
            --require-target aarch64-apple-macosx15.0

  publish-pypi:
    name: Publish tagged wheels to PyPI
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/talos-sv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: talos-wheel-*
          path: dist
          merge-multiple: true

      # Configure PyPI's Trusted Publisher for Kuree/talos, ci.yml, environment pypi.
      - name: Publish all platform wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Test wasm on every ref; main also publishes the tested site for deployment.
  wasm-build-and-test:
    name: Build and test (wasm32-unknown-emscripten)
    needs: [generate-wasm-inputs, version]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set development version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python utils/packaging/dev_version.py "${{ needs.version.outputs.timestamp }}"

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: talos-generated-files
          path: build-host-generated

      - name: Pull wasm32 SDK image
        run: docker pull "$WASM_IMAGE"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-wasm-${{ runner.os }}-

      - name: Prepare compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          docker run --rm -v "$CCACHE_DIR:/ccache" \
            -e CCACHE_DIR=/ccache "$WASM_IMAGE" \
            sh -c 'ccache --max-size=2G && ccache --set-config=sloppiness=pch_defines,time_macros && ccache --zero-stats'

      # Feed the SDK bundled in the image to CMake through a local file URL.
      - name: Configure talos for wasm32
        run: |
          docker run --rm -v "$PWD:/src" -v "$CCACHE_DIR:/ccache" \
            -v "$PWD/build-host-generated:/talos-generated:ro" \
            -e CMAKE_BUILD_PARALLEL_LEVEL \
            -w /src -e CCACHE_DIR=/ccache "$WASM_IMAGE" bash -c '
              set -euo pipefail
              SHA=$(cat "$OBELISK_LLVM_WASM_SHA256_FILE")
              emcmake cmake -S . -B build-wasm -G Ninja \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DTALOS_ENABLE_PCH=ON \
                -DTALOS_INCLUDE_TESTS=OFF \
                -DTALOS_LLVM_PREBUILT_URL="file://$OBELISK_LLVM_WASM_SDK" \
                -DTALOS_LLVM_PREBUILT_SHA256="$SHA" \
                -DTALOS_GENERATED_DIR=/talos-generated \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            '

      - name: Build talos for wasm32
        id: build
        run: |
          docker run --rm -v "$PWD:/src" -v "$CCACHE_DIR:/ccache" \
            -v "$PWD/build-host-generated:/talos-generated:ro" \
            -e CMAKE_BUILD_PARALLEL_LEVEL \
            -w /src -e CCACHE_DIR=/ccache "$WASM_IMAGE" bash -c '
              set -euo pipefail
              time cmake --build build-wasm --target talos talos-cov
            '

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-wasm
          path: |
            build-wasm/.ninja_log
            build-wasm/talos_z3_project-prefix/src/talos_z3_project-build/.ninja_log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Compiler cache stats
        if: always()
        run: |
          docker run --rm -v "$CCACHE_DIR:/ccache" \
            -e CCACHE_DIR=/ccache "$WASM_IMAGE" ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ runner.os }}-${{ github.sha }}

      - name: Assemble site
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            mkdir -p site/toolchain
            cp -r web/* site/
            cp build-wasm/tools/driver/talos.wasm site/
            cp build-wasm/tools/driver/talos.js site/
            cp build-wasm/tools/talos-cov/talos-cov.wasm site/
            cp build-wasm/tools/talos-cov/talos-cov.js site/
            cp build-wasm/target-runtime/libtalos_rt.a site/toolchain/
            # Populate Emscripten cache entries for the no-exception ABI, then
            # publish exactly those libc++ variants for simulation links.
            em++ /emsdk/upstream/emscripten/test/hello_world.cpp -O3 \
              -fno-exceptions -o /tmp/hello.js
            LIB=/emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten
            cp "$LIB/libstubs.a" site/toolchain/libstubs.a
            cp "$LIB/libnoexit.a" site/toolchain/libnoexit.a
            cp "$LIB/libc.a" site/toolchain/libc.a
            cp "$LIB/libdlmalloc.a" site/toolchain/libdlmalloc.a
            cp "$LIB/libclang_rt.builtins.a" site/toolchain/libcompiler_rt.a
            cp "$LIB/libc++-noexcept.a" site/toolchain/libc++.a
            cp "$LIB/libc++abi-noexcept.a" site/toolchain/libc++abi.a
            cp "$LIB/libunwind-noexcept.a" site/toolchain/libunwind.a
            du -sh site
            test "$(du -sm site | cut -f1)" -lt 1000
          '

      - name: Reject wasm exception opcodes
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            OBJDUMP=/emsdk/upstream/bin/llvm-objdump
            test -x "$OBJDUMP"
            PATTERN="^[[:space:]]+[0-9a-f]+: .*\\b(try|try_table|catch|catch_all|delegate|rethrow|throw|throw_ref)\\b"
            DUMP=$(mktemp)
            trap "rm -f \"$DUMP\"" EXIT
            for input in site/talos.wasm site/talos-cov.wasm site/toolchain/*.a; do
              if ! "$OBJDUMP" -d "$input" >"$DUMP" 2>&1; then
                echo "failed to disassemble $input" >&2
                cat "$DUMP" >&2
                exit 1
              fi
              if grep -Eq "$PATTERN" "$DUMP"; then
                echo "wasm exception opcode found in $input" >&2
                exit 1
              fi
            done
          '

      - name: Run browser unit tests
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            for test in test/web/*.test.mjs; do node "$test"; done
            python3 -m unittest discover -s test/hosting -p "*_test.py"
            node --test test/hosting/*.test.mjs
          '

      - name: Run browser-toolchain smoke test
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TALOS_WEB_SITE=site \
            "$WASM_IMAGE" node test/web/smoke-test.mjs

      # Cover every shipped design at both optimization levels.
      - name: Run every example design
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TALOS_WEB_SITE=site \
            "$WASM_IMAGE" node test/web/examples-test.mjs -O3
          docker run --rm -v "$PWD:/src" -w /src -e TALOS_WEB_SITE=site \
            "$WASM_IMAGE" node test/web/examples-test.mjs -O0

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: talos-playground-site
          path: site
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Building wasm can overlap native tests; publication still requires both.
  deploy-cloudflare:
    name: Deploy Cloudflare and R2
    needs: [build-and-test, wasm-build-and-test]
    # Setting the account variable enables publication after credentials exist.
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: https://talos-sv.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Retries never overwrite the objects used by an active deployment.
      SITE_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = ("CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN",
                      "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure GitHub Actions credentials: " + ", ".join(missing))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: talos-playground-site
          path: build-sites/playground

      - uses: actions/download-artifact@v4
        with:
          name: talos-docs-site
          path: build-sites/docs

      - name: Upload both sites to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
        run: |
          python3 -m venv "$RUNNER_TEMP/talos-upload"
          "$RUNNER_TEMP/talos-upload/bin/python" -m pip install -r utils/cloudflare/requirements.txt
          "$RUNNER_TEMP/talos-upload/bin/python" utils/cloudflare/upload.py \
            --playground build-sites/playground --docs build-sites/docs \
            --release "$SITE_RELEASE"

      # Switch the serving Worker only after the entire R2 release is present.
      - name: Deploy site router
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: utils/cloudflare
          wranglerVersion: '4.153.0'
          command: deploy
          vars: SITE_RELEASE

      - name: Check public sites
        run: |
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors \
            --dump-header "$RUNNER_TEMP/talos-landing-headers" \
            --head https://talos-sv.org/
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors \
            --dump-header "$RUNNER_TEMP/talos-landing-css-headers" \
            --head https://talos-sv.org/landing.css
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors \
            --dump-header "$RUNNER_TEMP/talos-docs-headers" \
            --head https://docs.talos-sv.org/
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors \
            --dump-header "$RUNNER_TEMP/talos-wasm-headers" \
            --head https://playground.talos-sv.org/talos.wasm
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name, content_type in (("landing", "text/html"), ("landing-css", "text/css"),
                                     ("docs", "text/html"), ("wasm", "application/wasm")):
              path = Path(os.environ["RUNNER_TEMP"]) / f"talos-{name}-headers"
              headers = dict(line.lower().split(":", 1) for line in path.read_text().splitlines() if ":" in line)
              assert headers["x-talos-release"].strip() == os.environ["SITE_RELEASE"]
              assert headers["content-type"].strip().startswith(content_type)
          print("Landing page, documentation, and playground serve the expected release and MIME types")
          PY
