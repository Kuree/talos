[build-system]
requires = ["scikit-build-core>=0.11", "delocate>=0.13; sys_platform == 'darwin'"]
build-backend = "scikit_build_core.build"

[project]
name = "talos-sv"
dynamic = ["version"]
description = "An ahead-of-time SystemVerilog simulator"
readme = "README.md"
requires-python = ">=2.7"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "docs/third-party/licenses/*"]

[project.urls]
Source = "https://github.com/Kuree/talos"

[project.scripts]
talos = "talos_sv:main"
talos-cov = "talos_sv:coverage"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
cmake.define.TALOS_INCLUDE_TESTS = "OFF"
build.targets = ["talos", "talos-cov"]
install.components = ["talos"]
wheel.packages = ["python/talos_sv"]
wheel.install-dir = "talos_sv"
wheel.py-api = "py2.py3"
sdist.include = ["VERSION"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^(?P<value>\d+\.\d+\.\d+(?:\.dev\d+)?)\s*$'
